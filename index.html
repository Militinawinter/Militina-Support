<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Militina Support</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #03020a;
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(138, 43, 226, 0.25) 0%, transparent 50%),
                radial-gradient(circle at 85% 80%, rgba(0, 180, 216, 0.22) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(67, 97, 238, 0.15) 0%, transparent 60%);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            min-height: -webkit-fill-available;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            color: #f1f5f9;
            overflow-x: hidden;
            position: relative;
        }

        /* Desktop Cursor Styling */
        @media (pointer: fine) {
            * {
                cursor: none !important;
            }

            .cursor-dot {
                width: 8px;
                height: 8px;
                background: #00b4d8;
                border-radius: 50%;
                position: fixed;
                top: 0;
                left: 0;
                pointer-events: none;
                z-index: 9999;
                transform: translate(-50%, -50%);
                box-shadow: 0 0 10px #00b4d8, 0 0 20px #7209b7;
                transition: transform 0.15s ease-out;
            }

            .cursor-outline {
                width: 38px;
                height: 38px;
                border: 2px solid rgba(114, 9, 183, 0.7);
                border-radius: 50%;
                position: fixed;
                top: 0;
                left: 0;
                pointer-events: none;
                z-index: 9998;
                transform: translate(-50%, -50%);
                transition: transform 0.25s ease-out, width 0.2s, height 0.2s, border-color 0.2s;
            }

            .particle {
                position: fixed;
                pointer-events: none;
                border-radius: 50%;
                z-index: 9997;
                animation: fadeOut 0.6s linear forwards;
            }
        }

        /* Touch Device Fallback */
        @media (pointer: coarse) {
            .cursor-dot, .cursor-outline, .particle {
                display: none !important;
            }
            * {
                cursor: auto !important;
            }
        }

        @keyframes fadeOut {
            0% { opacity: 0.9; transform: scale(1); }
            100% { opacity: 0; transform: scale(0.1); }
        }

        /* Animated Glowing Orbs Background */
        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
            animation: pulseOrb 8s infinite alternate ease-in-out;
        }

        .orb-1 {
            width: 300px;
            height: 300px;
            background: rgba(114, 9, 183, 0.35);
            top: 10%;
            left: 10%;
        }

        .orb-2 {
            width: 350px;
            height: 350px;
            background: rgba(72, 149, 239, 0.25);
            bottom: 10%;
            right: 10%;
            animation-delay: -4s;
        }

        @keyframes pulseOrb {
            0% { transform: scale(1) translate(0, 0); opacity: 0.6; }
            100% { transform: scale(1.2) translate(30px, -30px); opacity: 0.9; }
        }

        /* Ambient Cyber Grid & Hologram Overlay */
        .bg-grid {
            position: absolute;
            width: 200%;
            height: 200%;
            background-size: 40px 40px;
            background-image: 
                linear-gradient(to right, rgba(114, 9, 183, 0.08) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(72, 149, 239, 0.08) 1px, transparent 1px);
            transform: rotate(-12deg);
            z-index: 0;
            pointer-events: none;
        }

        .scanline {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: linear-gradient(to bottom, transparent 50%, rgba(0, 0, 0, 0.25) 51%);
            background-size: 100% 4px;
            z-index: 1;
            pointer-events: none;
            opacity: 0.6;
        }

        /* Glass Form Container */
        .card {
            position: relative;
            z-index: 10;
            background: rgba(10, 8, 26, 0.75);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(114, 9, 183, 0.4);
            border-radius: 24px;
            padding: 45px 40px;
            width: 100%;
            max-width: 520px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.9),
                        0 0 40px rgba(114, 9, 183, 0.25),
                        inset 0 0 15px rgba(72, 149, 239, 0.1);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .card:hover {
            border-color: rgba(72, 149, 239, 0.7);
            box-shadow: 0 25px 70px rgba(0, 0, 0, 0.95),
                        0 0 50px rgba(72, 149, 239, 0.35),
                        inset 0 0 20px rgba(114, 9, 183, 0.2);
        }

        .header {
            margin-bottom: 32px;
            text-align: left;
        }

        .tag {
            font-family: 'Orbitron', sans-serif;
            font-size: 0.75rem;
            color: #4cc9f0;
            letter-spacing: 3px;
            text-transform: uppercase;
            margin-bottom: 8px;
            display: inline-block;
            text-shadow: 0 0 10px rgba(76, 201, 240, 0.6);
        }

        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2rem;
            font-weight: 900;
            letter-spacing: 1.5px;
            background: linear-gradient(135deg, #ffffff 0%, #7209b7 50%, #4cc9f0 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(114, 9, 183, 0.3);
        }

        .input-group {
            position: relative;
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            color: #a0aec0;
            letter-spacing: 1.2px;
            text-transform: uppercase;
            margin-bottom: 8px;
            transition: color 0.3s ease;
        }

        input, textarea {
            width: 100%;
            padding: 16px 20px;
            background: rgba(5, 4, 15, 0.85);
            border: 1px solid rgba(114, 9, 183, 0.25);
            border-radius: 12px;
            color: #f8fafc;
            font-family: 'Plus Jakarta Sans', sans-serif;
            font-size: 0.95rem;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            outline: none;
        }

        input:focus, textarea:focus {
            border-color: #4cc9f0;
            background: rgba(12, 9, 30, 0.95);
            box-shadow: 0 0 20px rgba(76, 201, 240, 0.3), inset 0 0 10px rgba(114, 9, 183, 0.3);
            transform: translateY(-2px);
        }

        textarea {
            resize: vertical;
            min-height: 125px;
        }

        .btn-submit {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #560bad 0%, #7209b7 50%, #4361ee 100%);
            border: none;
            border-radius: 12px;
            color: #ffffff;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            position: relative;
            overflow: hidden;
            transition: all 0.35s ease;
            box-shadow: 0 8px 25px rgba(114, 9, 183, 0.4);
        }

        .btn-submit:hover {
            background: linear-gradient(135deg, #4361ee 0%, #4cc9f0 100%);
            color: #03020a;
            box-shadow: 0 0 30px rgba(76, 201, 240, 0.7);
            transform: translateY(-3px);
            font-weight: 900;
        }

        .btn-submit:active {
            transform: translateY(-1px);
        }

        /* Success Overlay */
        .success-screen {
            display: none;
            text-align: center;
            padding: 30px 10px;
            animation: fadeIn 0.5s ease forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .success-icon {
            width: 70px;
            height: 70px;
            background: rgba(76, 201, 240, 0.1);
            border: 2px solid #4cc9f0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            color: #4cc9f0;
            font-size: 2rem;
            box-shadow: 0 0 25px rgba(76, 201, 240, 0.4);
        }

        .success-screen h2 {
            font-family: 'Orbitron', sans-serif;
            font-size: 1.6rem;
            color: #4cc9f0;
            margin-bottom: 12px;
            letter-spacing: 2px;
            text-shadow: 0 0 15px rgba(76, 201, 240, 0.5);
        }

        .success-screen p {
            color: #a0aec0;
            font-size: 0.95rem;
            line-height: 1.5;
        }

        /* Mobile Responsive Adjustments */
        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .card {
                padding: 30px 22px;
                border-radius: 18px;
            }

            h1 {
                font-size: 1.55rem;
            }

            .tag {
                font-size: 0.68rem;
                letter-spacing: 2px;
            }

            input, textarea {
                padding: 14px 16px;
                font-size: 0.9rem;
            }

            .btn-submit {
                padding: 16px;
                font-size: 0.85rem;
                letter-spacing: 1.8px;
            }
        }
    </style>
</head>
<body>

    <div class="bg-grid"></div>
    <div class="scanline"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <!-- Custom Cursor (Desktop Only) -->
    <div class="cursor-dot"></div>
    <div class="cursor-outline"></div>

    <!-- Main Card -->
    <div class="card">
        
        <!-- Contact Form -->
        <form id="contactForm" action="https://formspree.io/f/mppzeane" method="POST">
            <div class="header">
                <span class="tag">FraglineUtils Support</span>
                <h1>Send Request</h1>
            </div>

            <div class="input-group">
                <label for="email">Sender Email</label>
                <input type="email" id="email" name="email" placeholder="your.name@domain.com" required autocomplete="off">
            </div>

            <div class="input-group">
                <label for="title">Subject Title</label>
                <input type="text" id="title" name="title" placeholder="Brief statement..." required autocomplete="off">
            </div>

            <div class="input-group">
                <label for="message">Transmission Body</label>
                <textarea id="message" name="message" placeholder="Type your full message here..." required></textarea>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">Send Transmission ➔</button>
        </form>

        <!-- Inline Success Message -->
        <div class="success-screen" id="successScreen">
            <div class="success-icon">✓</div>
            <h2>SUBMITTED</h2>
            <p>Your packet was sent successfully to supporter, we'll reply back later</p>
        </div>

    </div>

    <script>
        // Custom Cursor & Particle Trail Effect (Desktop)
        const dot = document.querySelector('.cursor-dot');
        const outline = document.querySelector('.cursor-outline');

        if (window.matchMedia("(pointer: fine)").matches) {
            window.addEventListener('mousemove', (e) => {
                const posX = e.clientX;
                const posY = e.clientY;

                dot.style.left = `${posX}px`;
                dot.style.top = `${posY}px`;

                outline.animate({
                    left: `${posX}px`,
                    top: `${posY}px`
                }, { duration: 350, fill: "forwards" });

                // Spawn dynamic cyber particles
                if (Math.random() < 0.35) {
                    const particle = document.createElement('div');
                    particle.classList.add('particle');
                    const size = Math.random() * 6 + 2;
                    particle.style.width = `${size}px`;
                    particle.style.height = `${size}px`;
                    particle.style.left = `${posX}px`;
                    particle.style.top = `${posY}px`;
                    particle.style.background = Math.random() > 0.5 ? '#4cc9f0' : '#7209b7';
                    particle.style.boxShadow = `0 0 10px ${particle.style.background}`;
                    document.body.appendChild(particle);

                    setTimeout(() => particle.remove(), 600);
                }
            });

            // Hover expansions for cursor
            const interactables = document.querySelectorAll('input, textarea, button');
            interactables.forEach(el => {
                el.addEventListener('mouseenter', () => {
                    outline.style.width = '55px';
                    outline.style.height = '55px';
                    outline.style.borderColor = '#4cc9f0';
                });
                el.addEventListener('mouseleave', () => {
                    outline.style.width = '38px';
                    outline.style.height = '38px';
                    outline.style.borderColor = 'rgba(114, 9, 183, 0.7)';
                });
            });
        }

        // Async Form Submission (No Redirects)
        const form = document.getElementById('contactForm');
        const successScreen = document.getElementById('successScreen');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            
            submitBtn.textContent = 'TRANSMITTING...';
            submitBtn.style.opacity = '0.7';

            const data = new FormData(form);

            try {
                const response = await fetch(form.action, {
                    method: 'POST',
                    body: data,
                    headers: { 'Accept': 'application/json' }
                });

                if (response.ok) {
                    form.style.display = 'none';
                    successScreen.style.display = 'block';
                } else {
                    alert("Submission failed. Please check connection.");
                    submitBtn.textContent = 'SEND TRANSMISSION ➔';
                    submitBtn.style.opacity = '1';
                }
            } catch (error) {
                alert("An error occurred during submission.");
                submitBtn.textContent = 'SEND TRANSMISSION ➔';
                submitBtn.style.opacity = '1';
            }
        });
    </script>
</body>
</html>
